name: スニダン相場 スクレイピング

on:
  schedule:
    # 00:00 UTC (= JST 9時) と 09:00 UTC (= JST 18時) の1日2回。
    # 約200件を1件ずつ数秒待機して開く構成のため、bank 側と同じ */30 は負荷が過大。
    - cron: "0 0,9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード (probe / resolve / poll / all)"
        required: false
        default: "all"
        type: choice
        options: ["all", "resolve", "poll", "probe"]
      probe_url:
        description: "probe モードで開く商品ページURL"
        required: false
        default: ""
      max_items:
        description: "処理件数の上限 (0 = 無制限。テスト時は 5 など)"
        required: false
        default: "0"
      dry_run:
        description: "スプレッドシートへ書き込まず動作確認のみ (1で有効)"
        required: false
        default: "0"

# 既存 bank 側 (group: scrape) とは別グループ。
# 同じ名前にすると 30分おきの bank 側と待ち合わせが発生し、両方詰まる。
concurrency:
  group: scrape-snkr
  cancel-in-progress: false

jobs:
  scrape-snkr:
    runs-on: ubuntu-latest
    # 1件ずつ待機して開くため 30分では足りない
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run normalize tests
        run: python scraper/tests/test_snkr_normalize.py

      - name: Run snkr scraper
        env:
          # 既存 scrape.py と共有してよいのはこの2つだけ
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # 以降はすべて SNKR_ 名前空間 (bank 側の挙動に影響させない)
          SNKR_MODE: ${{ github.event.inputs.mode || 'all' }}
          SNKR_PROBE_URL: ${{ github.event.inputs.probe_url || vars.SNKR_PROBE_URL }}
          SNKR_MAX_ITEMS: ${{ github.event.inputs.max_items || '0' }}
          SNKR_MAP_WORKSHEET: ${{ vars.SNKR_MAP_WORKSHEET }}
          SNKR_DATA_WORKSHEET: ${{ vars.SNKR_DATA_WORKSHEET }}
          SNKR_REQUEST_DELAY: ${{ vars.SNKR_REQUEST_DELAY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scraper/snkr_scrape.py

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 既存の debug-page とは別名 (成果物ファイル名も probe_* に分離)
          name: debug-snkr
          path: |
            probe_page.html
            probe_screenshot.png
            probe_text.txt
          if-no-files-found: ignore
          retention-days: 7
